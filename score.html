<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>score</title>

<style>
body{
    font-family: Tahoma, Arial, sans-serif;
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
}

.container{
    width:420px;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:12px;
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    font-size:16px;
    border-radius:8px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

.formule{
    margin:18px 0;
    padding:12px;
    background:#eef5ff;
    border-radius:8px;
    font-size:18px;
    text-align:center;
}

.result{
    margin-top:20px;
    text-align:center;
}

#g{
    font-size:22px;
    font-weight:bold;
}

#score{
    font-size:36px;
    font-weight:bold;
}

.score-green{color:#28a745;}
.score-orange{color:#ff9800;}
.score-red{color:#e53935;}

small{
    color:#666;
}
</style>
</head>

<body>

<div class="container">

<h2>معدل الحفظ</h2>

<label>ضارب الخطأ</label>
<input type="number" id="coef" step="0.1" value="1.5">

<label>الأخطاء</label>
<input type="number" id="fautes" value="0" min="0">

<label>الترددات</label>
<input type="number" id="taraddud" value="0" min="0">

<label>عدد الصفحات</label>
<input type="number" id="pages" value="1" min="1">

<div class="formule">
<b>المعادلة الأولى</b><br><br>

G =
<span id="coefText">1.5</span>
×
<span id="fautesText">0</span>
+
<span id="taraddudText">0</span>
</div>

<div class="formule">
<b>المعادلة الثانية</b><br><br>

النتيجة =
100 × (1 −
<span id="gText">0</span>
÷
<span id="pagesText">20</span>)
</div>

<div class="result">
<div>قيمة G</div>
<div id="g">0.00</div>

<br>

<div>النتيجة</div>
<div id="score" class="score-green">100.00%</div>
</div>

</div>

<script>

const coef=document.getElementById("coef");
const fautes=document.getElementById("fautes");
const taraddud=document.getElementById("taraddud");
const pages=document.getElementById("pages");

function calc(){

let c=parseFloat(coef.value)||0;
let f=parseFloat(fautes.value)||0;
let t=parseFloat(taraddud.value)||0;
let p=parseFloat(pages.value)||1;

let G=c*f+t;
let score=100*(1-G/p);

score=Math.max(0,Math.min(100,score));

document.getElementById("coefText").textContent=c;
document.getElementById("fautesText").textContent=f;
document.getElementById("taraddudText").textContent=t;
document.getElementById("pagesText").textContent=p;
document.getElementById("gText").textContent=G.toFixed(2);

document.getElementById("g").textContent=G.toFixed(2);

const scoreDiv=document.getElementById("score");
scoreDiv.textContent=score.toFixed(2)+"%";

scoreDiv.className="";

if(score>90){
    scoreDiv.classList.add("score-green");
}
else if(score>70){
    scoreDiv.classList.add("score-orange");
}
else{
    scoreDiv.classList.add("score-red");
}

}

coef.addEventListener("input",calc);
fautes.addEventListener("input",calc);
taraddud.addEventListener("input",calc);
pages.addEventListener("input",calc);

calc();

</script>

</body>
</html>
