<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> تقييم الحفظ</title>

<style>
*{
    box-sizing:border-box;
    font-family:"Tahoma",sans-serif;
}

body{
    background:#edf2f7;
    margin:0;
    padding:40px;
    display:flex;
    justify-content:center;
}

.calculator{
    width:700px;
    max-width:100%;
    background:white;
    border-radius:20px;
    padding:35px;
    box-shadow:0 10px 35px rgba(0,0,0,.12);
}

h1{
    text-align:center;
    margin-bottom:35px;
    color:#234;
}

.card{
    background:#f9fbfd;
    border-radius:18px;
    padding:25px;
    margin-bottom:25px;
    border:1px solid #dde6ef;
}

.formula{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:12px;
    font-size:34px;
}

.var{
    display:flex;
    flex-direction:column;
    align-items:center;
}

.var small{
    color:#666;
    font-size:12px;
    margin-bottom:6px;
    font-weight:bold;
}

.var input{
    width:80px;
    text-align:center;
    font-size:26px;
    padding:6px;
    border:none;
    border-bottom:3px solid #1976d2;
    background:transparent;
    outline:none;
}

.fraction{
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    margin:0 8px;
}

.numerator{
    padding-bottom:6px;
}

.line{
    width:110px;
    border-top:3px solid black;
}

.denominator{
    padding-top:6px;
}

.result{
    margin-top:30px;
    text-align:center;
}

.result h2{
    margin-bottom:15px;
}

#score{
    display:inline-block;
    font-size:48px;
    font-weight:bold;
    padding:18px 35px;
    border-radius:18px;
    transition:.3s;
    color:white;
}

.green{
    background:#28a745;
}

.orange{
    background:#ff9800;
}

.red{
    background:#e53935;
}

#gammaValue{
    font-size:28px;
    text-align:center;
    margin-top:20px;
    font-weight:bold;
    color:#1565c0;
}
</style>

</head>

<body>

<div class="calculator">

<h1> تقييم الحفظ</h1>

<div class="card">

<div class="formula">

γ =

<div class="var">
<small>ضارب الخطأ</small>
<input id="coef" type="number" step="0.1" value="1.5">
</div>

×

<div class="var">
<small>الأخطاء</small>
<input id="fautes" type="number" value="0">
</div>

+

<div class="var">
<small>الترددات</small>
<input id="taraddud" type="number" value="0">
</div>

</div>

<div id="gammaValue">
γ = 0.00
</div>

</div>

<div class="card">

<div class="formula">

النتيجة =

100 ×

(

1 −

<div class="fraction">

<div class="numerator">
<div class="var">
<small>γ</small>
<input id="gammaBox" readonly>
</div>
</div>

<div class="line"></div>

<div class="denominator">
<div class="var">
<small>عدد الصفحات</small>
<input id="pages" type="number" value="1" min="1">
</div>
</div>

</div>

)

</div>

</div>

<div class="result">

<h2>النتيجة النهائية</h2>

<div id="score" class="green">
100.00 %
</div>

</div>

</div>

<script>

const coef=document.getElementById("coef");
const fautes=document.getElementById("fautes");
const taraddud=document.getElementById("taraddud");
const pages=document.getElementById("pages");

function calculate(){

let c=parseFloat(coef.value)||0;
let f=parseFloat(fautes.value)||0;
let t=parseFloat(taraddud.value)||0;
let p=parseFloat(pages.value)||1;

let gamma=c*f+t;

let score=100*(1-gamma/p);

score=Math.max(0,Math.min(100,score));

document.getElementById("gammaBox").value=gamma.toFixed(2);

document.getElementById("gammaValue").innerHTML=
"γ = <b>"+gamma.toFixed(2)+"</b>";

const result=document.getElementById("score");

result.innerHTML=score.toFixed(2)+" %";

result.className="";

if(score>90)
result.classList.add("green");
else if(score>70)
result.classList.add("orange");
else
result.classList.add("red");

}

document.querySelectorAll("input").forEach(i=>{
i.addEventListener("input",calculate);
});

calculate();

</script>

</body>
</html>
