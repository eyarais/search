        function getSurahWeights() {

            let linesMap = {}

            quranData.forEach(a => {

                let name = a.sura_name_ar.trim()

                let start = parseInt(a.line_start)
                let end = parseInt(a.line_end)

                if (!linesMap[name]) {
                    linesMap[name] = new Set()
                }

                for (let i = start; i <= end; i++) {
                    linesMap[name].add(i)
                }

            })

            let weights = {}

            Object.keys(linesMap).forEach(s => {
                weights[s] = linesMap[s].size
            })

            return weights
        }
        function shuffleArray(arr) {

            let array = [...arr]

            for (let i = array.length - 1; i > 0; i--) {

                let j = Math.floor(Math.random() * (i + 1))

                    ;[array[i], array[j]] = [array[j], array[i]]
            }

            return array
        }
        function distributeBalanced(selected, daysCount, isRandom = false) {

            let weights = getSurahWeights()

            let ordered = quranData
                .map(a => a.sura_name_ar.trim())
                .filter(name => selected.includes(name))

            ordered = [...new Set(ordered)]


            if (isRandom) {
                ordered = shuffleArray(ordered)
            }

            let totalWeight = ordered.reduce((sum, s) => sum + weights[s], 0)
            let target = totalWeight / daysCount

            let days = []
            let currentDay = []
            let currentWeight = 0

            for (let i = 0; i < ordered.length; i++) {

                let s = ordered[i]
                let w = weights[s]

                let withCurrent = currentWeight + w

                let diffWith = Math.abs(target - withCurrent)
                let diffWithout = Math.abs(target - currentWeight)

                if (
                    currentDay.length > 0 &&
                    diffWithout < diffWith &&
                    days.length < daysCount - 1
                ) {
                    days.push(currentDay)
                    currentDay = []
                    currentWeight = 0
                }

                currentDay.push(s)
                currentWeight += w
            }

            days.push(currentDay)

            while (days.length < daysCount) {
                days.push([])
            }

            return days
        }
        function generate(isRandom = false) {

            let selected = [...list.selectedOptions].map(o => o.value)
            let focusSurah = [...focus.selectedOptions].map(o => o.value)

            let daysCount = parseInt(document.getElementById("daysCount").value)
            let split = document.getElementById("splitIntoTwo").checked

            let days = distributeBalanced(selected, daysCount, isRandom)

            let text = "🌼 جدول المراجعة 🌼\n\n"

            days.forEach((d, i) => {

                text += "🟢 اليوم " + (i + 1) + ":\n"

                if (split) {
                    let mid = Math.ceil(d.length / 2)
                    let first = d.slice(0, mid)
                    let second = d.slice(mid)

                    let tasmi3 = [...new Set([...focusSurah, ...first])]

                    text += "📖 تسميع: " + tasmi3.join(" – ") + "\n"
                    text += "🌙 غيبي: " + second.join(" – ") + "\n"

                } else {
                    let full = [...new Set([...focusSurah, ...d])]
                    text += full.join(" – ") + "\n"
                }

                text += "\n"
            })

            document.getElementById("result").value = text
            navigator.clipboard.writeText(text)
        }
