    <script>

        function loadSurahs(showAll = false) {

                list.appendChild(o1)

                let o2 = document.createElement("option")
                o2.value = s
                o2.text = s
                focus.appendChild(o2)
            })
        } loadSurahs(false)

        //liseneeeeeeeeeeeeeeeeeeeeeeeerrrrrrrrrrs
        document.getElementById("showAll").addEventListener("change", function () {
            loadSurahs(this.checked)
        })
        document.getElementById("splitIntoTwo").addEventListener("change", function () {
            generate()
        })
        document.getElementById("showLines").addEventListener("change", generate)
        const list = document.getElementById("surahList")
        const focus = document.getElementById("focusList")

        surahs.forEach(s => {

            let o1 = document.createElement("option")

        })

            let map = {}

            })

            return weights
        }*/function getSurahLines(name) {
            let total = 0

            quranData.forEach(a => {
                if (a.sura_name_ar.trim() === name) {
                    let start = parseInt(a.line_start)
                    let end = parseInt(a.line_end)
                    total += (end - start + 1)
                }
            })

            return total
        }
        function getSurahWeights() {

            let linesMap = {}

            quranData.forEach(a => {

                let name = a.sura_name_ar.trim()

                let start = parseInt(a.line_start)
                let end = parseInt(a.line_end)

                if (!linesMap[name]) {
                    linesMap[name] = new Set()
                }

                for (let i = start; i <= end; i++) {
                    linesMap[name].add(i)
                }

            })

            let weights = {}

            Object.keys(linesMap).forEach(s => {
                weights[s] = linesMap[s].size
            })

            return weights
        }
        function shuffleArray(arr) {

            let array = [...arr]

            for (let i = array.length - 1; i > 0; i--) {

                let j = Math.floor(Math.random() * (i + 1))

                    ;[array[i], array[j]] = [array[j], array[i]]
            }

            return array
        }
        function distributeBalanced(selected, daysCount, isRandom = false) {

            let weights = getSurahWeights()

            let ordered = [...new Set(selected)]

            if (isRandom) {
                ordered = shuffleArray(ordered)
            }

            // نحسب الوزن الكلي بالأسطر
            let totalWeight = ordered.reduce((sum, s) => sum + weights[s], 0)
            let target = totalWeight / daysCount

            let days = Array.from({ length: daysCount }, () => [])
            let dayWeights = new Array(daysCount).fill(0)

            for (let s of ordered) {

                let w = weights[s]

                // نحط السورة في اليوم الأقل امتلاءً
                let minIndex = dayWeights.indexOf(Math.min(...dayWeights))

                days[minIndex].push(s)
                dayWeights[minIndex] += w
            }

            return days
        }
        function generate(isRandom = false) {

            let selected = [...list.selectedOptions].map(o => o.value)
            let focusSurah = [...focus.selectedOptions].map(o => o.value)

            let daysCount = parseInt(document.getElementById("daysCount").value)
            let split = document.getElementById("splitIntoTwo").checked
            let showLines = document.getElementById("showLines").checked

            let days = distributeBalanced(selected, daysCount, isRandom)

            let text = "🌼 جدول المراجعة 🌼\n\n"

            days.forEach((d, i) => {

                text += "🟢 اليوم " + (i + 1) + ":\n"

                let fullDay = [...new Set([...focusSurah, ...d])]

                if (split) {

                    let tasmi3 = []
                    let ghaybi = []

                    let tasmi3Lines = 0
                    let ghaybiLines = 0

                    let totalLines = fullDay.reduce((sum, s) => sum + getSurahLines(s), 0)
                    let half = totalLines / 2

                    for (let s of fullDay) {

                        let lines = getSurahLines(s)

                        if (tasmi3.length === 0 || tasmi3Lines + lines <= half) {
                            tasmi3.push(s)
                            tasmi3Lines += lines
                        } else {
                            ghaybi.push(s)
                            ghaybiLines += lines
                        }
                    }

                    text += "📖 تسميع: " + tasmi3.join(" – ") + "\n"

                    if (showLines) {
                        text += "📊 أسطر التسميع: " + tasmi3Lines + "\n"
                    }

                    text += "\n🌙 غيبي: " + ghaybi.join(" – ") + "\n"

                    if (showLines) {
                        text += "📊 أسطر الغيبي: " + ghaybiLines + "\n"
                        text += "📊 المجموع: " + totalLines + "\n"
                    }

                } else {

                    let totalLines = fullDay.reduce((sum, s) => sum + getSurahLines(s), 0)

                    text += fullDay.join(" – ") + "\n"

                    if (showLines) {
                        text += "📊 عدد الأسطر: " + totalLines + "\n"
                    }
                }

                text += "\n"
            })

            document.getElementById("result").value = text
            navigator.clipboard.writeText(text)
        }</script>
