        function getSurahWeights() {

            let linesMap = {}

            quranData.forEach(a => {

                let name = a.sura_name_ar.trim()

                let start = parseInt(a.line_start)
                let end = parseInt(a.line_end)

                if (!linesMap[name]) {
                    linesMap[name] = new Set()
                }

                for (let i = start; i <= end; i++) {
                    linesMap[name].add(i)
                }

            })

            let weights = {}

            Object.keys(linesMap).forEach(s => {
                weights[s] = linesMap[s].size
            })

            return weights
        }
        function shuffleArray(arr) {

            let array = [...arr]

            for (let i = array.length - 1; i > 0; i--) {

                let j = Math.floor(Math.random() * (i + 1))

                    ;[array[i], array[j]] = [array[j], array[i]]
            }

            return array
        }
        function distributeBalanced(selected, daysCount, isRandom = false) {

            let weights = getSurahWeights()

            let days = Array.from({ length: daysCount }, () => [])
            let totals = Array(daysCount).fill(0)

            let sorted = selected.sort((a, b) => weights[b] - weights[a])


            if (isRandom) {
                sorted = shuffleArray(sorted)
            }

            sorted.forEach(s => {

                let minIndex = totals.indexOf(Math.min(...totals))

                days[minIndex].push(s)
                totals[minIndex] += weights[s]

            })

            return days
        }
        function generate(isRandom = false) {

            let selected = [...list.selectedOptions].map(o => o.value)
            let focusSurah = [...focus.selectedOptions].map(o => o.value)

            let daysCount = parseInt(document.getElementById("daysCount").value)
            let split = document.getElementById("splitIntoTwo").checked

            let days = distributeBalanced(selected, daysCount, isRandom)

            let text = "🌼 جدول المراجعة المتوازن 🌼\n\n"

            days.forEach((d, i) => {

                text += "🟢 اليوم " + (i + 1) + ":\n"

                if (split) {
                    let mid = Math.ceil(d.length / 2)
                    let first = d.slice(0, mid)
                    let second = d.slice(mid)

                    let tasmi3 = [...new Set([...focusSurah, ...first])]

                    text += "📖 تسميع: " + tasmi3.join(" – ") + "\n"
                    text += "🌙 غيبي: " + second.join(" – ") + "\n"

                } else {
                    let full = [...new Set([...focusSurah, ...d])]
                    text += full.join(" – ") + "\n"
                }

                text += "\n"
            })

            document.getElementById("result").value = text
            navigator.clipboard.writeText(text)
        }
    </script>
